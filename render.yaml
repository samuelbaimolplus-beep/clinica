services:
  - type: web
    name: clinica-vida-salud
    runtime: docker
    repo: https://github.com/samuelbaimolplus-beep/clinica
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: "off"
    envVars:
      - key: APP_NAME
        value: Clínica Vida Salud
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: CLINIC_DEPLOY_DATABASE
        value: neondb
      - key: PGCHANNELBINDING
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_COOKIE
        value: clinica_session
      - key: CACHE_STORE
        value: database
      - key: CACHE_PREFIX
        value: clinica_cache_
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Clínica Vida Salud
      - key: PAYPAL_ENABLED
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BOB_PER_USD
        value: "10"
      - key: PAYPAL_WEBHOOK_ID
        sync: false
